name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts

  verify-macos:
    name: macOS native reads (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts
