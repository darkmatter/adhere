name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Run the launcher against the linux-x64 package
        run: |
          # Outside the checkout, where the launcher has no source to fall back to.
          launcher="$RUNNER_TEMP/launcher"
          mkdir -p "$launcher/node_modules/@drkmttr"
          cp -r bin "$launcher/bin"
          ln -s "$PWD/dist/npm/linux-x64" "$launcher/node_modules/@drkmttr/adhere-linux-x64"
          node "$launcher/bin/adhere.js" --version
