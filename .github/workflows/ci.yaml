name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: [self-hosted, darkmatter, dm-x86_64-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts

  verify-macos:
    name: macOS native reads
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts
