name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: arc
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts

  verify-macos:
    name: macOS native reads
    runs-on: [self-hosted, macos]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts
