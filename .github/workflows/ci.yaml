name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts

  verify-macos:
    name: macOS native reads
    # Fork PRs keep Linux verification and never execute on trusted Macs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, dm-aarch64-darwin]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - name: Verify installed npm packages and native semantic reads
        timeout-minutes: 6
        run: bun scripts/verify-npm.ts
