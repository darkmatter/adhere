name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.3.0."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.3.0."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release tag matches package version
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ "$version" == "$TAG_NAME" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like vX.Y.Z, optionally with a prerelease/build suffix." >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Release tag $TAG_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Publish the platform packages
        run: |
          for directory in dist/npm/*/; do
            name="$(node -p "require('./${directory}package.json').name")"
            version="$(node -p "require('./${directory}package.json').version")"
            # A rerun after a partial publish skips the versions already on npm.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published."
            else
              npm publish "$directory" --access public --provenance
            fi
          done
      - name: Publish @drkmttr/adhere with the platform packages as optional dependencies
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@drkmttr/adhere@$version" version >/dev/null 2>&1; then
            echo "@drkmttr/adhere@$version is already published."
          else
            bun scripts/npm-packages.ts pin
            npm publish --access public --provenance
          fi
