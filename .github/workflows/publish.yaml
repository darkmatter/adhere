name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify release tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:npm
      - name: Publish the platform packages
        run: |
          for directory in dist/npm/*/; do
            name="$(node -p "require('./${directory}package.json').name")"
            version="$(node -p "require('./${directory}package.json').version")"
            # A rerun after a partial publish skips the versions already on npm.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published."
            else
              npm publish "$directory" --access public --provenance
            fi
          done
      - name: Publish @drkmttr/adhere with the platform packages as optional dependencies
        run: |
          bun scripts/npm-packages.ts pin
          npm publish --access public --provenance
